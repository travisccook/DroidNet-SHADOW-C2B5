; SHADOW-C2B5 - Main Controller for the C2-B5 astromech droid
; Arduino Mega ADK: PS3 Move Navigation input, Sabertooth/SyRen motor control,
; serial commands to the rest of the droid.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor --baud 115200
; Lint:    pio check

[platformio]
description = SHADOW+MD+C2B5 main controller for the C2-B5 astromech droid
default_envs = SHADOWC2B5
; Sabertooth is compiled as part of the sources (main.cpp includes it by
; relative path), so the source root is the project root and build_src_filter
; picks the directories to build.
src_dir = .

[env:SHADOWC2B5]
; Pinned so every machine builds the same firmware. A newer platform brings a newer
; Arduino core (5.3.0 -> core 1.8.8), which changes the binary. Upgrade deliberately.
platform = platformio/atmelavr@5.1.0
framework = arduino
board = megaADK
monitor_speed = 115200
extra_scripts =
    post:scripts/post_build.py
build_src_filter =
    +<src/>
    +<lib/Sabertooth/>
; Unit tests run only in [env:native]; never build or upload a test image to the Mega.
test_ignore = *
build_flags =
    -D BOARD_SHADOWC2B5
    -D ENABLE_UHS_DEBUGGING=1
    -I include
    -I lib/Sabertooth
    -I lib/USB_Host_Shield
; Upload configuration for reliable programming
upload_protocol = wiring
upload_speed = 115200
; upload_port = /dev/ttyACM0  ; Uncomment and adjust for your system
; Linting configuration
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,bugprone-*,performance-*,readability-*,-readability-magic-numbers,-bugprone-narrowing-conversions
check_src_filters =
    +<src/>
    +<include/>
    +<lib/WdpAnnounce/>

[env:native]
; Host unit tests for hardware-independent logic: pio test -e native
; Uses the system compiler (Xcode Command Line Tools on macOS).
platform = platformio/native
test_framework = unity
