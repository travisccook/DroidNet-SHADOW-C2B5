; DroidNet-SHADOW-C2B5 - Main Controller for the C2-B5 astromech droid
; Arduino Mega ADK: PS3 Move Navigation input, Sabertooth/SyRen motor control,
; serial commands to the rest of the droid.
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor --baud 115200
; Lint:    pio check

[platformio]
description = SHADOW+MD+C2B5 main controller for the C2-B5 astromech droid
default_envs = SHADOWC2B5
; Sabertooth is compiled as part of the sources (main.cpp includes it by
; relative path), so the source root is the project root and build_src_filter
; picks the directories to build.
src_dir = .

[env:SHADOWC2B5]
; Pinned so every machine builds the same firmware. A newer platform brings a newer
; Arduino core (5.3.0 -> core 1.8.8), which changes the binary. Upgrade deliberately.
platform = platformio/atmelavr@5.1.0
framework = arduino
board = megaADK
monitor_speed = 115200
extra_scripts =
    post:scripts/post_build.py
build_src_filter =
    +<src/>
    +<lib/Sabertooth/>
build_flags =
    -D BOARD_SHADOWC2B5
    -D ENABLE_UHS_DEBUGGING=1
    ; SHADOW_FW_VERSION = the git commit (a new commit rebuilds everything).
    ; python3, not python: macOS has no `python` on PATH, and $PYTHONEXE isn't expanded here.
    !python3 scripts/git_rev.py
    -I include
    -I lib/Sabertooth
    -I lib/USB_Host_Shield
; Upload configuration for reliable programming
upload_protocol = wiring
upload_speed = 115200
; upload_port = /dev/ttyACM0  ; Uncomment and adjust for your system
; Linting configuration
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,bugprone-*,performance-*,readability-*,-readability-magic-numbers,-bugprone-narrowing-conversions
check_src_filters =
    +<src/>
    +<include/>

; ---------------------------------------------------------------------------------------
; Unit tests for the button-mapping library (lib/ShadowMap) and the built-in defaults.
;   pio test -e native                    host build (fast)
;   pio test -e simavr --without-uploading
;                                         the same tests on an emulated ATmega2560: real
;                                         avr-libc, EEPROM, 16-bit int and PROGMEM
; Test files must #include <unity.h> themselves: the library finder doesn't look inside
; test/support headers.
; ---------------------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<src/default_mappings.cpp>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Werror
    -I include
    -I test/support
lib_ignore = USB_Host_Shield, Sabertooth

[env:simavr]
platform = platformio/atmelavr@5.1.0
framework = arduino
board = megaADK
platform_packages = platformio/tool-simavr
test_framework = unity
test_speed = 115200
test_build_src = yes
build_src_filter = +<src/default_mappings.cpp>
build_flags =
    -I include
    -I test/support
lib_ignore = USB_Host_Shield, Sabertooth
; simavr exits when the test program sleeps with interrupts off (test/support/sm_test_main.h)
test_testing_command =
    ${platformio.packages_dir}/tool-simavr/bin/simavr
    -m
    atmega2560
    -f
    16000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf
