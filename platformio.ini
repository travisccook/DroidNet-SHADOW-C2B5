; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = SHADOW+MD+C2B5 main controller for the C2-B5 astromech droid
default_envs = SHADOWC2B5
src_dir = .

[env:SHADOWC2B5]
platform = platformio/atmelavr@5.1.0
framework = arduino
board = megaADK
monitor_speed = 115200
extra_scripts = 
	post:scripts/post_build.py
build_src_filter = 
	+<src/>
	+<lib/Sabertooth/>
build_flags = 
	-D BOARD_SHADOWC2B5
	-D ENABLE_UHS_DEBUGGING=1
	-I include
	-I lib/Sabertooth
	-I lib/USB_Host_Shield
upload_protocol = wiring
upload_speed = 115200
check_tool = clangtidy
check_flags = 
	clangtidy: --checks=-*,bugprone-*,performance-*,readability-*,-readability-magic-numbers,-bugprone-narrowing-conversions
check_src_filters = 
	+<src/>
	+<include/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<src/default_mappings.cpp>
build_flags = 
	-std=gnu++17
	-Wall
	-Wextra
	-Werror
	-I include
	-I test/support
lib_ignore = USB_Host_Shield, Sabertooth
lib_deps = throwtheswitch/Unity@^2.6.1

[env:simavr]
platform = platformio/atmelavr@5.1.0
framework = arduino
board = megaADK
platform_packages = platformio/tool-simavr
test_framework = unity
test_speed = 115200
test_build_src = yes
build_src_filter = +<src/default_mappings.cpp>
build_flags = 
	-I include
	-I test/support
lib_ignore = USB_Host_Shield, Sabertooth
test_testing_command = 
	${platformio.packages_dir}/tool-simavr/bin/simavr
	-m
	atmega2560
	-f
	16000000L
	${platformio.build_dir}/${this.__env__}/firmware.elf
